name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HUSKY: 0
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet tool restore
      - run: dotnet restore PgRestWms.slnx
      - run: dotnet build PgRestWms.slnx --no-restore --configuration Release
      - run: dotnet csharpier check .

      # PostgreSQL 18.6 and PostgREST in Docker (Testcontainers) - the runner has Docker.
      - run: dotnet test --solution PgRestWms.slnx --no-build --configuration Release

      # wwwroot/app.css is committed; it must be what the pinned Tailwind CLI builds from the markup.
      - name: Generated CSS is up to date
        run: |
          ./scripts/tailwind.sh
          git diff --exit-code -- src/PgRestWms.Web/wwwroot/app.css

      - run: docker build -t wms-pg-rest-web:ci .
